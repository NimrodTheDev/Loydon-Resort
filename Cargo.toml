[workspace]
members = ["frontend", "backend", "shared"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"

[workspace.dependencies]
# Web Framework
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors", "compression"] }
hyper = "1"

# Frontend
leptos = { version = "0.6", features = ["nightly"] }
leptos_meta = "0.6"
leptos_router = "0.6"
leptos_axum = "0.6"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wasm-bindgen = "0.2"
web-sys = "0.3"
cfg-if = "1.0"
wasm-logger = "0.2"
console_error_panic_hook = "0.1"
